<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backspool — Threadrail Cartridge Inspector</title><style>body{margin:0;background:#111a24;color:#e0faff;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:16px;left:16px;max-width:340px;padding:16px;border:1px solid #50848e;background:#0a141de8;border-radius:10px}h1{font-size:20px;margin:0 0 8px}button{padding:9px;background:#193b4b;color:#dcfbff;border:1px solid #43747b;border-radius:4px;margin:3px;cursor:pointer}p{font-size:12px;line-height:1.5}#status{color:#86eaff}@media(max-width:600px){aside{top:8px;left:8px;right:8px;padding:9px}h1{font-size:16px}}</style></head><body><aside><h1>Threadrail Cartridge</h1><p>Tripo body · authored moving fins/jaws<br>8 cm folded diameter · ~2.2 cm casing</p><div id="states"><button data-state="folded">Folded</button><button data-state="flight">Flight</button><button data-state="anchored">Deployed</button></div><div id="views"><button data-view="hero">¾</button><button data-view="top">Top</button><button data-view="bottom">Bottom</button><button data-view="side">Side</button></div><button id="pair">A / B</button><button id="auto">Rotate</button><p id="status">Loading real GLB…</p><p>Drag to orbit · scroll to zoom. Local reconstruction of moving parts; the original Tripo export remains preserved.</p></aside><script src="scripts/vendor/three-r128.js"></script><script src="scripts/vendor/GLTFLoader-r128.js"></script><script src="scripts/game_threadrail_cartridge_visuals.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x15212c);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.001,10),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe0faff,0x607481,1));const light=new THREE.DirectionalLight(0xffffff,1.1);light.position.set(1,2,1);scene.add(light);const rim=new THREE.DirectionalLight(0x69b7ff,.8);rim.position.set(-1,.5,-1);scene.add(rim);const underside=new THREE.DirectionalLight(0xd9e7f2,.65);underside.position.set(0,-2,1);scene.add(underside);const asset=createThreadrailCartridgeVisuals(THREE,scene);let state='folded',pair='A',yaw=.7,pitch=.7,distance=innerWidth<650?.32:.24,rotate=false,last=performance.now(),ready=false;const status=document.getElementById('status');
function layout(){camera.setViewOffset(innerWidth,innerHeight,innerWidth>650?-Math.min(140,innerWidth*.12):0,innerWidth<=650?-innerHeight*.14:0,innerWidth,innerHeight);}layout();
function view(name){if(name==='top'){pitch=Math.PI/2-.001;yaw=0}else if(name==='bottom'){pitch=-Math.PI/2+.001;yaw=0}else if(name==='side'){pitch=.06;yaw=Math.PI/2}else{pitch=.7;yaw=.7}}
function render(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(rotate)yaw+=dt*.4;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(0,0,0);asset.begin(dt);if(ready)asset.pose('inspection',new THREE.Vector3(),new THREE.Vector3(0,1,0),state,pair,camera.position);asset.end();renderer.render(scene,camera);requestAnimationFrame(render)}
asset.ready.then(()=>{ready=true;status.textContent='GLB loaded · '+asset.state().sourceTask}).catch(e=>status.textContent=String(e));for(const b of document.querySelectorAll('[data-state]'))b.onclick=()=>state=b.dataset.state;for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);document.getElementById('pair').onclick=()=>{pair=pair==='A'?'B':'A';asset.reset()};document.getElementById('auto').onclick=()=>rotate=!rotate;let drag=null;renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag[1])*.008,-1.55,1.55);drag=[e.clientX,e.clientY]};renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onwheel=e=>{e.preventDefault();distance=THREE.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),.11,.6)};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();layout();renderer.setSize(innerWidth,innerHeight)};window.cartridgeInspector={state:()=>({state,pair,asset:asset.state()}),setState:v=>state=v,view};requestAnimationFrame(render);
</script></body></html>
